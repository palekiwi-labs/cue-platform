# cast container tmux: terminal ergonomics only (clipboard, keys, shell). Host-specific style/prefix/bindings live elsewhere.
set -g set-clipboard on
set -g allow-passthrough on
set -ga terminal-overrides ',xterm-256color:Ms=\E]52;%p1%s;%p2%s\007'
set -g extended-keys on
set -g extended-keys-format csi-u

# New panes: non-login Debian bash. A login shell would source
# /etc/profile, which resets PATH and drops the devshell env the server
# inherited. Debian bash also has readline (stdenv bash does not).
set -g default-shell /bin/bash
set -g default-command /bin/bash

# Statusline: sits under the host tmux bar (both at top). Band is a shade
# darker than the kitty background (#0F1319) so it reads as a separate bar.
# Right side is reserved for session state.
set -ga terminal-overrides ',tmux*:RGB'
set -g status-position top
set -g status-justify centre
set -g status-style 'fg=colour7 bg=#0A0D11'
set -g status-left ''
set -g status-right ''
# Tab colour from window options (contract in window-picker.sh): review
# state first, then pi state: red failed/blocked, yellow running/working,
# green ok/finished-unseen, else default.
setw -g window-status-format '#{?#{==:#{@review_state},failed},#[fg=colour1],#{?#{==:#{@review_state},running},#[fg=colour3],#{?#{==:#{@review_state},ok},#[fg=colour2],#{?#{==:#{@pi_state},blocked},#[fg=colour1],#{?#{==:#{@pi_state},working},#[fg=colour3],#{?@pi_unseen,#[fg=colour2],}}}}}} #W '
setw -g window-status-style 'fg=colour8'
setw -g window-status-current-format '#{?#{==:#{@review_state},failed},#[fg=colour1],#{?#{==:#{@review_state},running},#[fg=colour3],#{?#{==:#{@review_state},ok},#[fg=colour2],#{?#{==:#{@pi_state},blocked},#[fg=colour1],#{?#{==:#{@pi_state},working},#[fg=colour3],#{?@pi_unseen,#[fg=colour2],}}}}}} #W '
set-hook -g session-window-changed 'set-option -w @pi_unseen ""'
setw -g window-status-current-style 'fg=colour15,bold'
setw -g window-status-separator ''
set -g message-style 'fg=colour2 bg=#0A0D11 bold'

# Fuzzy window picker (nix/tmux/window-picker.sh).
bind-key w display-popup -E -w 60% -h 50% @windowPicker@
bind-key -n C-f display-popup -E -w 60% -h 50% @windowPicker@

# New window running pi (keeps a bash shell after pi exits).
bind-key C new-window -c "#{pane_current_path}" \; send-keys pi Enter
